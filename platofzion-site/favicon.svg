<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#faf7f3"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1024" height="1024" rx="205" ry="205"/>
    </clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1b1712" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <!-- survey grid, behind the state -->
    <g fill="#cfc7ba">
      <rect x="125.5" y="0" width="5" height="1024"/><rect x="0" y="125.5" width="1024" height="5"/>
      <rect x="253.5" y="0" width="5" height="1024"/><rect x="0" y="253.5" width="1024" height="5"/>
      <rect x="381.5" y="0" width="5" height="1024"/><rect x="0" y="381.5" width="1024" height="5"/>
      <rect x="509.5" y="0" width="5" height="1024"/><rect x="0" y="509.5" width="1024" height="5"/>
      <rect x="637.5" y="0" width="5" height="1024"/><rect x="0" y="637.5" width="1024" height="5"/>
      <rect x="765.5" y="0" width="5" height="1024"/><rect x="0" y="765.5" width="1024" height="5"/>
      <rect x="893.5" y="0" width="5" height="1024"/><rect x="0" y="893.5" width="1024" height="5"/>
    </g>
    <!-- Utah, in surveyor red, on top -->
    <polygon fill="#96432b" filter="url(#sh)"
      points="257.5,182 562.9,182 562.9,314 766.5,314 766.5,842 257.5,842"/>
  </g>
</svg>
