<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plat of Zion — Parcel</title>
<meta name="description" content="A parcel shared from Plat of Zion, the Utah parcel viewer.">
<meta name="theme-color" content="#96432B">
<style>
:root{--paper:#f3ebe4;--paper-2:#faf6f1;--ink:#1b1712;--ink-soft:#5c5148;--accent:#96432b;
--serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{margin:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:32px}
.card{max-width:520px;text-align:center}
.kicker{font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:600;margin-bottom:14px}
h1{font-family:var(--serif);font-size:clamp(30px,6vw,44px);font-weight:600;line-height:1.15;margin-bottom:14px}
p{color:var(--ink-soft);font-size:17px;line-height:1.5;margin-bottom:28px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
font-weight:600;font-size:17px;padding:14px 30px;border-radius:999px}
.alt{display:block;margin-top:18px;color:var(--accent);font-size:15px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="kicker">PLAT OF ZION</div>
  <h1>This parcel lives in the app.</h1>
  <p>Someone shared a Utah parcel with you — its boundary, owner of record,
  assessed value, and zoning are one tap away in Plat of Zion.</p>
  <a class="btn" href="https://apps.apple.com/app/id6790371834">Get Plat of Zion</a>
  <a class="alt" id="openApp" href="#">Already have it? Open the parcel</a>
</div>
<script>
document.getElementById("openApp").href = "platofzion://parcel" + location.search;
</script>
</body>
</html>
